# Production stack: Postgres, the API, Caddy in front of both, and a nightly
# database dump.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Caddy obtains and renews the certificate for $DOMAIN on its own; the host
# needs ports 80 and 443 reachable and the domain's A record pointing at it.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately not published to the host: only the API needs it, and it
    # reaches it over the compose network.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      WEB_ORIGIN: https://${DOMAIN}
      # One hop — Caddy. Without this the rate limiter would key every request
      # to the proxy's address and throttle the whole team as one client.
      TRUST_PROXY: '1'
      UPLOAD_DIR: ./uploads
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-FlowDesk <no-reply@localhost>}
      EMAIL_TOKEN_TTL_HOURS: ${EMAIL_TOKEN_TTL_HOURS:-48}
      INVITE_TOKEN_TTL_DAYS: ${INVITE_TOKEN_TTL_DAYS:-14}
    volumes:
      - uploads:/app/apps/api/uploads
    healthcheck:
      # Migrations run before the server binds, so "started" and "answering"
      # are not the same moment. wget comes from busybox in the base image.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # pg_dump reads the password from here rather than the command line,
      # where it would show up in `ps` for every user on the host.
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    entrypoint: ['sh', '/usr/local/bin/backup.sh']

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
